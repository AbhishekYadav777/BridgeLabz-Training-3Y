<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Description provides information about the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">

    <!-- Author specifies the creator of the webpage -->
    <meta
        name="author"
        content="Abhishek">

    <!-- Base sets the base URL for relative URLs -->
    <base href="https://example.com/">

    <!-- Link connects external resources such as favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Style tag is used for CSS; left empty as required -->
    <style>
    </style>

    <!-- Script tag is used for JavaScript; left empty as required -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This page demonstrates important elements used inside the HTML head.
    </p>

</body>
</html>
