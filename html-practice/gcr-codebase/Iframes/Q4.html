<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Website</title>
</head>

<!-- Frameset divides the browser window into rows -->
<frameset rows="20%,80%">

    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" title="Navigation">

    <!-- Bottom frame displays welcome message -->
    <frame src="welcome.html" title="Welcome Message">

</frameset>

</html>
