<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding</h1>

    <!-- Spaces are encoded as %20 -->
    <!-- & is encoded as %26 when it is part of the query value -->

    <p>Encoded URL:</p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML &amp; CSS
    </a>

</body>
</html>
