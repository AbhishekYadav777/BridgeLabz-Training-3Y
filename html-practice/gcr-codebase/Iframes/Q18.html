<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>

    <h1>Quotations</h1>

    <!-- blockquote is used for a long quotation -->
    <blockquote>
        Learning HTML is an important step in web development.
        It helps us understand how webpages are structured &amp;
        how different elements work together.
    </blockquote>

    <!-- q is used for a short quotation -->
    <p>
        My teacher always says, <q>Practice makes perfect.</q>
    </p>

</body>
</html>
