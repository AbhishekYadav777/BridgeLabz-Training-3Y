<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>

    <h1>Secure Form</h1>

    <!-- autocomplete="off" prevents the browser from automatically filling form data -->
    <form action="#" method="post" autocomplete="off">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>
        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>
        <br><br>

        <input type="submit" value="Login">

    </form>

    <!-- Disabling autocomplete can reduce the chance of sensitive form data
         being automatically stored or displayed by the browser. -->
    <p>
        Turning off autocomplete can improve security by preventing
        sensitive information from being automatically filled or stored.
    </p>

</body>
</html>
