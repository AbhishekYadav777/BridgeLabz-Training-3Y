<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main>

                <p>Total Users: 1,250</p>

                <h2>Recent Activity</h2>

            </section>
        </main>

    </div>

</html>
