
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Task Tracker with Badges.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white py-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="h2 mb-1">Task Tracker</h1>
                <p class="mb-0">Keep your day moving forward.</p>
            </div>
            <span class="badge bg-warning text-dark fs-6">
                Pending: 4
            </span>
        </div>
    </header>

    <main class="container py-5">
        <section class="task-panel mx-auto">
            <h2 class="h4 mb-3">My Tasks</h2>

            <!-- Bootstrap list-group organizes task items. -->
            <ul class="list-group shadow-sm">
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Finish project report</span>
                    <span class="badge bg-danger rounded-pill">High</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Review lecture notes</span>
                    <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Organize study folder</span>
                    <span class="badge bg-success rounded-pill">Low</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Prepare weekly plan</span>
                    <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                </li>
            </ul>

            <div class="text-end mt-4">
                <button type="button" class="btn btn-success">
                    Completed <span class="badge bg-light text-success ms-1">2</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">Task Tracker &copy; 2026</p>
    </footer>
</body>
</html>
