
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Goods | Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Product Catalog.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white text-center py-4">
        <div class="container">
            <h1 class="fw-bold">Everyday Goods</h1>
            <p class="mb-0">Quality products for everyday life</p>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="text-center fw-bold mb-4">Our Products</h2>

        <!-- Bootstrap Grid: 1 column on mobile, 2 on small tablets, 4 on desktop -->
        <section class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Classic wristwatch">
                    <div class="card-body d-flex flex-column">
                        <h3 class="h5">Classic Watch</h3>
                        <p class="text-secondary">Minimal everyday design.</p>
                        <p class="fw-bold mt-auto">₹1,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Wireless headphones">
                    <div class="card-body d-flex flex-column">
                        <h3 class="h5">Headphones</h3>
                        <p class="text-secondary">Enjoy clear, rich sound.</p>
                        <p class="fw-bold mt-auto">₹2,299</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Compact camera">
                    <div class="card-body d-flex flex-column">
                        <h3 class="h5">Camera</h3>
                        <p class="text-secondary">Capture memorable moments.</p>
                        <p class="fw-bold mt-auto">₹4,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80" class="card-img-top" alt="Red running shoe">
                    <div class="card-body d-flex flex-column">
                        <h3 class="h5">Running Shoes</h3>
                        <p class="text-secondary">Comfort for every step.</p>
                        <p class="fw-bold mt-auto">₹2,799</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Everyday Goods &copy; 2026</p>
    </footer>
</body>
</html>
